name: Mise à jour de l'agenda

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lire Grist et écrire data.json
        env:
          GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
          GRIST_DOC_ID: ${{ secrets.GRIST_DOC_ID }}
        run: python3 maj_donnees.py
      - name: Enregistrer data.json
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Mise à jour des données de l'agenda" && git push)
