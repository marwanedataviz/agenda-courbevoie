<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda des activités – Courbevoie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{
  --bg:#FFF4E6; --card:#FFFFFF; --soft:#F5F4F1; --line:#ECE8E1;
  --ink:#2B2D33; --muted:#8A8F98; --faint:#B9BDC4;
  --sky:#BFE1F6; --accent:#3D6FD8; --accent-ink:#fff; --warn:#E5484D;
  --radius:22px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,sans-serif}
body{padding:16px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.app{max-width:1200px;margin:0 auto;background:var(--soft);border-radius:28px;overflow:hidden;box-shadow:0 10px 30px rgba(80,60,20,.08)}

/* En-tête */
.hero{background:var(--sky);padding:22px 24px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mascot{width:54px;height:54px;border-radius:18px;background:#FFD45C;display:grid;place-items:center;font-size:28px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.titles{flex:1;min-width:200px}
.titles h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.3px}
.titles p{margin:2px 0 0;color:#4B5563;font-size:14px}
.month{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800}
.arrow{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.6);display:grid;place-items:center;color:var(--accent);font-size:16px}
.arrow:hover{background:#fff}
.today-btn{padding:7px 14px;border-radius:999px;background:#fff;font-weight:700;font-size:13px;color:var(--accent)}

/* Bande de semaines */
.weeks{display:flex;gap:6px;padding:14px 18px 6px;overflow-x:auto;scrollbar-width:none}
.wk{flex:0 0 auto;text-align:center;padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:700;font-size:13px;line-height:1.15}
.wk small{display:block;font-weight:600;font-size:11px}
.wk:hover{background:#fff}
.wk.on{background:var(--warn);color:#fff;box-shadow:0 6px 14px rgba(229,72,77,.3)}

/* Barre d'outils */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 18px}
.seg{display:inline-flex;background:#fff;border-radius:999px;padding:4px;box-shadow:0 1px 0 var(--line)}
.seg button{padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.spacer{flex:1}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.stat b{font-weight:800}
.stat.warn{color:var(--warn)}

/* Pastilles de filtre */
.pills{display:flex;gap:8px;padding:2px 18px 14px;overflow-x:auto;scrollbar-width:thin}
.pill{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:#fff;font-weight:700;font-size:13px;border:2px solid transparent;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.pill .n{font-size:11px;color:var(--muted);font-weight:800}
.pill.on{border-color:var(--ink)}
.pill .dot{width:10px;height:10px;border-radius:50%}

/* Vue semaine */
.board{padding:6px 14px 20px;overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:10px;min-width:960px}
.col{background:transparent;border-radius:18px;padding:6px 4px}
.dh{padding:6px 8px 10px}
.dh .d{font-size:12px;font-weight:800;color:var(--muted)}
.dh .n{font-size:26px;font-weight:800;line-height:1.1}
.dh .c{font-size:11px;color:var(--muted);font-weight:700}
.col.we .dh .n{color:var(--faint)}
.col.today .dh .n{color:var(--accent)}
.chips{display:flex;flex-direction:column;gap:6px}
.chip{text-align:left;border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .08s}
.chip:hover{transform:translateY(-1px);filter:brightness(.97)}
.chip .t{opacity:.75;font-variant-numeric:tabular-nums}
.chip .x{overflow:hidden;text-overflow:ellipsis}
.chip.ov{box-shadow:inset 0 0 0 2px var(--warn)}
.chip.ov::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:auto;flex:0 0 auto}
.closed{border-radius:16px;padding:14px 10px;font-size:12px;font-weight:700;color:var(--muted);text-align:center;background:repeating-linear-gradient(45deg,#EFEDE8,#EFEDE8 7px,#E6E3DC 7px,#E6E3DC 14px)}
.empty{font-size:12px;color:var(--faint);padding:6px 8px}

/* Vue jour */
.days{display:flex;gap:6px;padding:4px 18px 10px;overflow-x:auto}
.dy{flex:0 0 auto;min-width:64px;text-align:center;padding:8px 10px;border-radius:16px;color:var(--muted);font-weight:700;font-size:12px}
.dy b{display:block;font-size:20px;color:var(--ink)}
.dy.on{background:var(--accent);color:#fff;box-shadow:0 8px 18px rgba(61,111,216,.3)}
.dy.on b{color:#fff}
.timeline{padding:6px 18px 24px;max-width:760px}
.daytitle{display:flex;gap:12px;align-items:baseline;margin:10px 0 16px}
.daytitle h2{margin:0;font-size:26px;font-weight:800}
.daytitle span{color:var(--muted);font-weight:600}
.row{display:grid;grid-template-columns:22px 56px 1fr;gap:12px;align-items:start;position:relative}
.row::before{content:"";position:absolute;left:10px;top:24px;bottom:-12px;width:2px;background:var(--line)}
.row:last-child::before{display:none}
.node{width:16px;height:16px;border-radius:50%;border:3px solid #D5D9E2;background:#fff;margin-top:14px;margin-left:3px;position:relative;z-index:1}
.hour{color:var(--muted);font-weight:700;padding-top:12px;font-variant-numeric:tabular-nums}
.card{border-radius:18px;padding:14px 16px;margin-bottom:12px;text-align:left;width:100%;box-shadow:0 6px 16px rgba(0,0,0,.06)}
.card h3{margin:0 0 4px;font-size:16px;font-weight:800}
.card p{margin:0;font-size:13px;opacity:.85;font-weight:600}
.card .tag{display:inline-block;margin-top:8px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.55)}
.card.ov{box-shadow:0 0 0 2px var(--warn),0 6px 16px rgba(0,0,0,.06)}

/* Légende */
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 18px 18px;font-size:12px;font-weight:700;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* Détail */
.back{position:fixed;inset:0;background:rgba(30,30,40,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.back.show{display:flex}
.sheet{background:#fff;border-radius:24px;max-width:420px;width:100%;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet .top{padding:18px 20px}
.sheet h3{margin:0;font-size:20px;font-weight:800}
.sheet .sub{font-weight:700;opacity:.8;margin-top:2px}
.sheet dl{margin:0;padding:14px 20px 20px;display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:14px}
.sheet dt{color:var(--muted);font-weight:700}
.sheet dd{margin:0;font-weight:600;word-break:break-word}
.sheet .close{float:right;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.6);font-weight:800}
.alert{margin:0 20px 16px;padding:10px 12px;border-radius:12px;background:#FDECEC;color:#A4262C;font-size:13px;font-weight:700}

.msg{padding:40px 20px;text-align:center;color:var(--muted);font-weight:700}
.note{padding:0 18px 10px;font-size:12px;color:var(--muted);font-weight:600}
@media (max-width:640px){
  body{padding:0}.app{border-radius:0}
  .titles h1{font-size:20px}.month{font-size:20px}
}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="mascot" aria-hidden="true">📅</div>
    <div class="titles">
      <h1>Agenda des activités</h1>
      <p id="source">Ville de Courbevoie · services municipaux et associations</p>
    </div>
    <div class="month">
      <button class="arrow" id="prev" aria-label="Semaine précédente">◀</button>
      <span id="monthLabel">—</span>
      <button class="arrow" id="next" aria-label="Semaine suivante">▶</button>
    </div>
    <button class="today-btn" id="today">Aujourd'hui</button>
  </header>

  <nav class="weeks" id="weeks"></nav>

  <div class="toolbar">
    <div class="seg" id="viewSeg">
      <button data-v="week" class="on">Semaine</button>
      <button data-v="day">Jour</button>
    </div>
    <span class="label">Voir par</span>
    <div class="seg" id="dimSeg">
      <button data-d="Quartier" class="on">Quartier</button>
      <button data-d="Type">Type d'activité</button>
      <button data-d="LieuNom">Lieu</button>
    </div>
    <div class="spacer"></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="pills" id="pills"></div>
  <div class="note" id="note"></div>

  <main id="main"><div class="msg">Chargement des données…</div></main>
  <div class="legend" id="legend"></div>
</div>

<div class="back" id="back"><div class="sheet" id="sheet"></div></div>

/* ============ Outils dates (tout en UTC pour éviter les décalages) ============ */
const DAY = 86400000;
const toDate = v => {
  if (v == null || v === "") return null;
  if (typeof v === "number") return new Date(Math.floor(v/86400)*DAY);
  if (v instanceof Date) return new Date(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate()));
  const m = String(v).match(/(\d{4})-(\d{2})-(\d{2})/);
  return m ? new Date(Date.UTC(+m[1], +m[2]-1, +m[3])) : null;
};
const monday = d => { const x = new Date(d); const wd = (x.getUTCDay()+6)%7; return new Date(x.getTime() - wd*DAY); };
const addDays = (d,n) => new Date(d.getTime()+n*DAY);
const todayUTC = () => { const n = new Date(); return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())); };
const same = (a,b) => a && b && a.getTime() === b.getTime();
const fmtShort = d => `${d.getUTCDate()} ${MOIS_C[d.getUTCMonth()]}`;
const list = v => Array.isArray(v) ? (v[0] === "L" ? v.slice(1) : v) : (v ? String(v).split(/,\s*/) : []);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/’/g,"'").trim().toLowerCase();
const minutes = h => { const m = String(h||"").match(/(\d{1,2})[:hH](\d{2})?/); return m ? (+m[1])*60 + (+(m[2]||0)) : 9999; };
const hhmm = h => { const m = minutes(h); return m === 9999 ? "" : `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`; };

/* ============ Lecture des tables (format colonnes de l'API Grist) ============ */
function rows(table){
  if (!table) return [];
  const keys = Object.keys(table); const n = (table.id || table[keys[0]] || []).length;
  return Array.from({length:n}, (_,i) => Object.fromEntries(keys.map(k => [k, table[k][i]])));
}
function pick(tables, test){ for (const [name,t] of Object.entries(tables)) if (test(t, name)) return t; return null; }

function build(tables){
  const actsT = pick(tables, (t,n) => "Jours" in t && "Heure_de_debut" in t && !/summary/i.test(n));
  const lieuxT = pick(tables, t => "Nom_du_lieu" in t && !("Jours" in t));
  const fermT = pick(tables, t => "Du" in t && "Au" in t);
  if (!actsT) throw new Error("Table des activités introuvable (colonnes « Jours » et « Heure de début »).");
  const lieux = new Map(rows(lieuxT).map(l => [l.id, l]));
  S.acts = rows(actsT)
    .filter(a => !("Statut" in a) || a.Statut === "Validé")
    .map(a => {
      const lieu = typeof a.Lieu === "number" ? lieux.get(a.Lieu) : null;
      const lieuNom = lieu ? lieu.Nom_du_lieu : (a.Lieu || "");
      return {
        id:a.id, nom:a.Nom_de_l_activite || a.Discipline || "Activité", disc:a.Discipline || "",
        Type:a.Type || "Autre", public:list(a.Public), acteur:a.Acteur || "", statut:a.Municipal_ou_associatif || "",
        LieuNom:lieuNom, Quartier:a.Quartier || (lieu && lieu.Quartier) || "—",
        jours:list(a.Jours), hd:hhmm(a.Heure_de_debut), hf:hhmm(a.Heure_de_fin),
        freq:a.Frequence || "", ponct:toDate(a.Date_si_ponctuel_),
        debut:toDate(a.Debut), fin:toDate(a.Fin),
        gratuit:a.Gratuit, tarif:a.Tarif_, unite:a.Unite_du_tarif, insc:a.Mode_d_inscription, contact:a.Contact
      };
    });
  S.closures = rows(fermT).map(f => ({du:toDate(f.Du), au:toDate(f.Au), motif:f.Motif || "Fermeture", cible:f.Concerne || "Tout"}))
                          .filter(f => f.du && f.au);
}

/* ============ Calcul des séances d'une semaine ============ */
function closureFor(date, lieuNom){
  return S.closures.find(f => date >= f.du && date <= f.au &&
    (["tout","vacances scolaires"].includes(norm(f.cible)) || norm(f.cible) === norm(lieuNom)));
}
function globalClosure(date){
  return S.closures.find(f => date >= f.du && date <= f.au && ["tout","vacances scolaires"].includes(norm(f.cible)));
}
function sessions(week){
  const out = [];
  for (const a of S.acts){
    for (const j of a.jours){
      const k = JOURS.findIndex(x => norm(x) === norm(j)); if (k < 0) continue;
      const date = addDays(week, k);
      if (a.ponct && a.freq === "Ponctuel" && !same(a.ponct, date)) continue;
      if (a.debut && date < a.debut) continue;
      if (a.fin && date > a.fin) continue;
      if (closureFor(date, a.LieuNom)) continue;
      out.push({...a, k, date});
    }
  }
  const key = s => [s.k, s.hd, norm(s.disc), norm(s.Quartier)].join("|");
  const count = {}; out.forEach(s => count[key(s)] = (count[key(s)]||0)+1);
  out.forEach(s => s.ov = count[key(s)] > 1);
  return out.sort((a,b) => minutes(a.hd) - minutes(b.hd) || a.nom.localeCompare(b.nom));
}

/* ============ Affichage ============ */
const $ = id => document.getElementById(id);

function render(){
  const week = S.week, all = sessions(week);
  const shown = S.val ? all.filter(s => s[S.dim] === S.val) : all;

  // Mois et semaines
  const end = addDays(week, 6);
  $("monthLabel").textContent = week.getUTCMonth() === end.getUTCMonth()
    ? `${MOIS[week.getUTCMonth()][0].toUpperCase()+MOIS[week.getUTCMonth()].slice(1)} ${week.getUTCFullYear()}`
    : `${MOIS_C[week.getUTCMonth()]} – ${MOIS_C[end.getUTCMonth()]} ${end.getUTCFullYear()}`;
  $("weeks").innerHTML = [-3,-2,-1,0,1,2,3,4].map(o => {
    const w = addDays(week, o*7), e = addDays(w,6);
    return `<button class="wk ${o===0?"on":""}" data-o="${o}"><small>${MOIS_C[w.getUTCMonth()]}${w.getUTCMonth()!==e.getUTCMonth()?" – "+MOIS_C[e.getUTCMonth()]:""}</small>${w.getUTCDate()} – ${e.getUTCDate()}</button>`;
  }).join("");

  // Pastilles du filtre choisi
  const counts = {}; all.forEach(s => counts[s[S.dim]] = (counts[s[S.dim]]||0)+1);
  const values = [...new Set(S.acts.map(a => a[S.dim]))].filter(Boolean).sort((a,b) => a.localeCompare(b,"fr"));
  $("pills").innerHTML = `<button class="pill ${!S.val?"on":""}" data-val="">Tout voir <span class="n">${all.length}</span></button>` +
    values.map(v => `<button class="pill ${S.val===v?"on":""}" data-val="${esc(v)}">${S.dim==="Type"?`<span class="dot" style="background:${col(v)[0]};box-shadow:inset 0 0 0 1px ${col(v)[1]}55"></span>`:""}${esc(v)} <span class="n">${counts[v]||0}</span></button>`).join("");

  // Chiffres clés
  const ov = shown.filter(s => s.ov).length;
  const closedDays = [0,1,2,3,4,5,6].filter(k => globalClosure(addDays(week,k))).length;
  $("stats").innerHTML = `<span class="stat"><b>${shown.length}</b> séances</span>` +
    (ov ? `<span class="stat warn" title="Même discipline, même heure, même quartier"><b>${ov}</b> en chevauchement</span>` : "") +
    (closedDays ? `<span class="stat"><b>${closedDays}</b> jour${closedDays>1?"s":""} fermé${closedDays>1?"s":""}</span>` : "");
  $("note").textContent = S.mode === "demo" ? "Aperçu avec les données fictives (hors de Grist). Dans Grist, la page lit directement votre document." : "";

  // Légende
  const types = [...new Set(S.acts.map(a => a.Type))].sort((a,b)=>a.localeCompare(b,"fr"));
  $("legend").innerHTML = types.map(t => `<span><i style="background:${col(t)[0]};box-shadow:inset 0 0 0 1px ${col(t)[1]}44"></i>${esc(t)}</span>`).join("") +
    `<span><i style="background:#fff;box-shadow:inset 0 0 0 2px var(--warn)"></i>Chevauchement</span>`;

  const today = todayUTC();
  if (S.view === "week"){
    $("main").innerHTML = `<div class="board"><div class="grid">` + JOURS.map((j,k) => {
      const d = addDays(week,k), list_ = shown.filter(s => s.k === k), cl = globalClosure(d);
      return `<section class="col ${k>4?"we":""} ${same(d,today)?"today":""}">
        <div class="dh"><div class="d">${j.slice(0,3).toUpperCase()}</div><div class="n">${String(d.getUTCDate()).padStart(2,"0")}</div>
        <div class="c">${cl ? "" : list_.length + " séance" + (list_.length>1?"s":"")}</div></div>
        <div class="chips">${cl ? `<div class="closed">Fermé<br>${esc(cl.motif)}</div>` :
          (list_.length ? list_.map(chip).join("") : `<div class="empty">Aucune activité</div>`)}</div>
      </section>`;
    }).join("") + `</div></div>`;
  } else {
    const d = addDays(week, S.day), list_ = shown.filter(s => s.k === S.day), cl = globalClosure(d);
    $("main").innerHTML = `<div class="days">` + JOURS.map((j,k) => {
      const x = addDays(week,k), n = shown.filter(s => s.k===k).length;
      return `<button class="dy ${k===S.day?"on":""}" data-k="${k}">${j.slice(0,3)}<b>${x.getUTCDate()}</b>${globalClosure(x)?"fermé":n}</button>`;
    }).join("") + `</div>
      <div class="timeline">
        <div class="daytitle"><h2>${JOURS[S.day]}</h2><span>${d.getUTCDate()} ${MOIS[d.getUTCMonth()]} ${d.getUTCFullYear()}</span></div>
        ${cl ? `<div class="closed">Fermé — ${esc(cl.motif)}</div>` :
          list_.length ? list_.map(card).join("") : `<div class="empty">Aucune activité ce jour-là pour ce choix.</div>`}
      </div>`;
  }
}
function chip(s){
  const [bg,fg] = col(s.Type);
  return `<button class="chip ${s.ov?"ov":""}" style="background:${bg};color:${fg}" data-id="${s.id}" data-k="${s.k}" title="${esc(s.nom)} · ${esc(s.acteur)} · ${esc(s.LieuNom)}">
    <span class="t">${s.hd}</span><span class="x">${esc(s.disc || s.nom)}</span></button>`;
}
function card(s){
  const [bg,fg] = col(s.Type);
  return `<div class="row"><span class="node"></span><span class="hour">${s.hd}</span>
    <button class="card ${s.ov?"ov":""}" style="background:${bg};color:${fg}" data-id="${s.id}" data-k="${s.k}">
      <h3>${esc(s.nom)}</h3><p>${esc(s.acteur)} · ${esc(s.LieuNom)}</p><p>${s.hd}${s.hf?" – "+s.hf:""} · ${esc(s.Quartier)}</p>
      <span class="tag">${esc(s.Type)}</span>${s.ov?` <span class="tag" style="color:var(--warn)">Chevauchement</span>`:""}
    </button></div>`;
}
function detail(id, k){
  const s = sessions(S.week).find(x => x.id == id && x.k == k); if (!s) return;
  const [bg,fg] = col(s.Type);
  const prix = s.gratuit === "Oui" ? "Gratuit" : (s.tarif ? `${s.tarif} €${s.unite?" / "+s.unite:""}` : "—");
  $("sheet").innerHTML = `<div class="top" style="background:${bg};color:${fg}">
      <button class="close" id="close" aria-label="Fermer">✕</button>
      <h3>${esc(s.nom)}</h3><div class="sub">${esc(s.Type)} · ${JOURS[s.k]} ${s.date.getUTCDate()} ${MOIS[s.date.getUTCMonth()]}</div></div>
    ${s.ov ? `<div class="alert" style="margin-top:14px">⚠ Une autre offre de ${esc(s.disc)} a lieu au même moment dans le même quartier.</div>` : ""}
    <dl>
      <dt>Horaire</dt><dd>${s.hd}${s.hf?" – "+s.hf:""}</dd>
      <dt>Porté par</dt><dd>${esc(s.acteur)}${s.statut?` (${esc(s.statut.toLowerCase())})`:""}</dd>
      <dt>Lieu</dt><dd>${esc(s.LieuNom)} · ${esc(s.Quartier)}</dd>
      <dt>Public</dt><dd>${esc(s.public.join(", ")) || "—"}</dd>
      <dt>Tarif</dt><dd>${prix}</dd>
      <dt>Inscription</dt><dd>${esc(s.insc || "—")}</dd>
      <dt>Contact</dt><dd>${esc(s.contact || "—")}</dd>
    </dl>`;
  $("back").classList.add("show");
}

/* ============ Interactions ============ */
document.addEventListener("click", e => {
  const t = e.target.closest("button, .back"); if (!t) return;
  if (t.id === "prev") { S.week = addDays(S.week,-7); render(); }
  else if (t.id === "next") { S.week = addDays(S.week,7); render(); }
  else if (t.id === "today") { S.week = monday(todayUTC()); render(); }
  else if (t.classList.contains("wk")) { S.week = addDays(S.week, +t.dataset.o*7); render(); }
  else if (t.dataset.v) { S.view = t.dataset.v; [...$("viewSeg").children].forEach(b => b.classList.toggle("on", b===t)); render(); }
  else if (t.dataset.d) { S.dim = t.dataset.d; S.val = null; [...$("dimSeg").children].forEach(b => b.classList.toggle("on", b===t)); render(); }
  else if (t.classList.contains("pill")) { S.val = t.dataset.val || null; render(); }
  else if (t.classList.contains("dy")) { S.day = +t.dataset.k; render(); }
  else if (t.dataset.id) { detail(t.dataset.id, t.dataset.k); }
  else if (t.id === "close" || (t.id === "back" && e.target.id === "back")) { $("back").classList.remove("show"); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") $("back").classList.remove("show"); });

/* ============ Démarrage ============ */
function firstUsefulWeek(){
  let w = monday(todayUTC());
  for (let i = 0; i < 10; i++){ if (sessions(w).length) return w; w = addDays(w,7); }
  return monday(todayUTC());
}
async function loadFromGrist(){
  const names = await grist.docApi.listTables();
  const tables = {};
  for (const n of names) { try { tables[n] = await grist.docApi.fetchTable(n); } catch(e) {} }
  build(tables);
}

  const inGrist = window.parent !== window && typeof grist !== "undefined";
  try {
    if (inGrist){
      S.mode = "grist";
      grist.ready({ requiredAccess: "full" });
      let timer;
      const refresh = () => { clearTimeout(timer); timer = setTimeout(async () => {
        try { await loadFromGrist(); if (!S.week) S.week = firstUsefulWeek(); render(); }
        catch(e){ $("main").innerHTML = `<div class="msg">En attente de l'accès aux données…<br><small>Choisissez « Accès complet » dans le panneau de droite.</small></div>`; }
      }, 300); };
      grist.onRecords(refresh);
      refresh();
      return;
    } else {
      try {
        const r = await fetch("data.json?t=" + Date.now());
        if (!r.ok) throw new Error();
        const d = await r.json();
        build(d.tables); S.mode = "public";
        const m = new Date(d.maj);
        $("source").textContent = `Ville de Courbevoie · mis à jour le ${m.toLocaleDateString("fr-FR")} à ${m.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}`;
      } catch(e) { build(DEMO); }
    }
    S.week = firstUsefulWeek();
    render();
  } catch(err){
    $("main").innerHTML = `<div class="msg">Impossible de lire les données.<br><small>${esc(err.message)}<br>Vérifiez que le widget a l'« accès complet » au document.</small></div>`;
  }
}
start();
</script>
</body>
</html>
